[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hobbyist-backend"
version = "0.1.0"
description = "Hobbyist AI App Backend - Python/FastAPI with Strands Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "python-dateutil>=2.8.2",
    "click>=8.1.7",
    "jinja2>=3.1.2",
    "pyyaml>=6.0.1",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.1",
    "httpx>=0.25.0",
    "faker>=21.0.0",
]
lint = [
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "black>=24.1.0",
]
tests = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.1",
    "pytest-mock>=3.12.0",
    "httpx>=0.25.0",
]

[project.scripts]
hobbyist-backend = "main:main"

[tool.setuptools.packages.find]
include = ["backend*", "utils*", "scripts*"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = [
    "E", "W", "F", "I",
    "B", "C4", "UP", "SIM",
]
ignore = ["E501",]  # line too long

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false