[project]
name = "hobbyist-backend"
version = "0.1.0"
description = "Hobbyist AI App Backend - Python/FastAPI with Strands Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn[standard]", "pydantic", "pydantic-settings", "python-multipart", "requests", "httpx", "python-jose[cryptography]", "passlib[bcrypt]", "sqlalchemy", "alembic", "aiosqlite", "python-dotenv", "pandas", "numpy", "scikit-learn", "python-dateutil", "click", "jinja2", "pyyaml", "python-json-logger"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-asyncio", "httpx", "faker"]
lint = ["ruff", "mypy", "black"]
tests = ["pytest", "pytest-asyncio", "pytest-mock", "httpx"]

[project.scripts]
uv-run-dev = "uvicorn.main:main"
uv-run-tests = "pytest.main"
uv-run-lint = "ruff.check.main"

[tool.setuptools.packages.find]
include = ["backend*", "utils*", "scripts*"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = [
    "E", "W", "F", "I",
    "B", "C4", "UP", "SIM",
]
ignore = ["E501",]  # line too long

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
